[workspace]
resolver = "2"
members = ["crates/exvia-proto", "crates/exvia-relay", "crates/exvia-agent", "crates/exvia-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MulanPSL-2.0"
repository = "https://github.com/jiachao2130/exvia"

[workspace.dependencies]
exvia-proto = { path = "crates/exvia-proto" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "fs", "signal", "process"] }
futures = "0.3"
bytes = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = "0.14"
# 证书有效期需要精确到秒的时间运算；time 本就是 rcgen 的传递依赖
time = { version = "0.3", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1", "tracing"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

yamux = "0.14"
tokio-util = { version = "0.7", features = ["compat"] }
snow = "0.9"

ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"

sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
rpassword = "7"
portable-pty = "0.9"
terminal_size = "0.4"
libc = "0.2"
dirs = "6"
